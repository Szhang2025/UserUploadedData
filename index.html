<!DOCTYPE html>
<html>
<head><title>Test Connection</title></head>
<body>
    <h1>Testing Stat353 Connection</h1>
    <button onclick="testConnection()">Test</button>
    <pre id="result"></pre>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz8m6FGOZa_3gFJo7EQlh-ZSR1BF7Ki8R3OOadtpZEY1TxQKqNU2oQkkOgkZVEMtIalIg/exec';

        function testConnection() {
            const cb = 'cb_' + Date.now();
            const url = SCRIPT_URL + '?action=status&callback=' + cb;
            
            document.getElementById('result').textContent = 'Calling: ' + url + '\n\nWaiting...';
            
            window[cb] = function(data) {
                document.getElementById('result').textContent = '✅ SUCCESS!\n\nSpreadsheet: ' + data.spreadsheetName + '\n\n' + JSON.stringify(data, null, 2);
            };
            
            const script = document.createElement('script');
            script.src = url;
            script.onerror = function() {
                document.getElementById('result').textContent = '❌ FAILED!\n\nTry clearing your browser cache and refreshing.';
            };
            document.body.appendChild(script);
        }
    </script>
</body>
</html>
